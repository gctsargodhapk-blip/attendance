<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CR Attendance</title>
<meta name="theme-color" content="#0b5d4b"><link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="CR Attendance">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#101828;--mu:#667085;--pine:#0b5d4b;--pine2:#0e7a63;--bg:#eef3f1;--card:#fff;--ln:#d7e0dc;--red:#b42318;--redbg:#fdecea}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Manrope,system-ui,sans-serif}
.top{background:var(--pine);color:#fff;padding:14px 16px;display:flex;gap:12px;align-items:center}
.mono{width:46px;height:46px;border-radius:12px;background:#fff;display:grid;place-items:center;padding:5px}.mono img{width:100%;height:100%;object-fit:contain}
.top h1{font-size:18px;margin:0;font-weight:800}.top p{margin:0;font-size:13px;opacity:.85}
.wrap{max-width:640px;margin:0 auto;padding:14px 14px 110px}
.panel{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:18px;margin-top:16px}
.panel h2{margin:0 0 4px;font-size:20px}.panel p{margin:0 0 14px;color:var(--mu)}
label{display:block;font-weight:700;font-size:13px;margin:12px 0 5px}
input{font:inherit;width:100%;padding:12px;border:1px solid var(--ln);border-radius:10px;background:#fff;color:var(--ink)}
input:focus,button:focus-visible{outline:3px solid #9fd8c8;outline-offset:1px}
.btn{font:inherit;font-weight:800;background:var(--pine);color:#fff;border:0;border-radius:12px;padding:13px 20px;cursor:pointer}
.btn:disabled{opacity:.5}.btn.full{width:100%;margin-top:18px}
.tools{position:sticky;top:0;background:var(--bg);padding:12px 0 8px;z-index:3}
.meta{display:flex;justify-content:space-between;align-items:center;margin:0 0 8px;color:var(--mu);font-size:13px;font-weight:700}
.seg{display:flex;gap:8px;margin-top:8px}.seg button{font:inherit;font-weight:700;border:1px solid var(--ln);background:#fff;color:var(--ink);padding:7px 14px;border-radius:99px}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:11px 12px;margin-bottom:8px;color:var(--ink);cursor:pointer}
.row .no{width:42px;font-weight:800;font-size:20px;color:var(--pine);letter-spacing:-.5px}
.row .nm{font-weight:700}.row small{display:block;color:var(--mu);font-weight:500}
.row .mk{margin-left:auto;width:34px;height:34px;border-radius:50%;border:2px solid var(--ln);display:grid;place-items:center;font-weight:800;color:transparent}
.row.lv{background:#fdf3dc;border-color:#ecd49a;cursor:default}.row.lv .no{color:#b7791f}.row.lv .mk{background:#b7791f;border-color:#b7791f;color:#fff}
.row.hf{background:#e8f0fb;border-color:#b9cdee}.row.hf .no{color:#2563a8}.row.hf .mk{background:#2563a8;border-color:#2563a8;color:#fff}
.sec{font-weight:800;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--mu);margin:14px 2px 8px}.sec.lv{color:#b7791f}
.dlrow{display:flex;gap:8px;margin-top:12px}.dlrow input{flex:1;min-width:0}.dlrow .btn{padding:10px 14px;white-space:nowrap}
.row.ab{background:var(--redbg);border-color:#f1b5ae}.row.ab .no{color:var(--red)}.row.ab .mk{background:var(--red);border-color:var(--red);color:#fff}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--ln);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.bar .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:14px}
.cnt{font-size:30px;font-weight:800;line-height:1;color:var(--red)}.cnt small{display:block;font-size:12px;color:var(--mu);font-weight:700;margin-top:3px}
.bar .btn{margin-left:auto;padding:14px 22px}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:99px;font-weight:700;font-size:14px;display:none;max-width:90%;text-align:center}
.err{color:var(--red);font-weight:700;margin-top:10px;min-height:20px}
[hidden]{display:none!important}
.rst{margin-left:auto;background:transparent;border:1px solid rgba(255,255,255,.6);color:#fff;border-radius:8px;padding:6px 10px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
.top{padding-top:calc(14px + env(safe-area-inset-top,0px))}
</style></head><body>
<div class="top"><div class="mono"><img src="../logo.png" alt="TEVTA logo"></div><div><h1>Attendance</h1><p id="cname">Class representative</p></div><button class="rst" id="rst" hidden>Reset</button></div>
<div class="wrap">
 <div id="login" class="panel"><h2>Connect your class</h2><p>Enter these once. They are saved only on this phone.</p>
  <label for="su">Web app link</label><input id="su" type="url" placeholder="https://script.google.com/.../exec" autocomplete="off">
  <label for="sn">Class name</label><input id="sn" placeholder="e.g. Third Year C" autocomplete="off">
  <label for="pin">Class PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="off">
  <button class="btn full" id="go">Connect</button><div class="err" id="err"></div></div>
 <div id="main" hidden>
  <div class="tools"><div class="meta"><span id="dlabel"></span><span id="state"></span></div>
   <input id="dt" type="date" style="margin-bottom:8px" aria-label="Date">
   <input id="q" type="search" placeholder="Search by name or roll number">
   <div class="seg"><button id="fAll" class="on">All students</button><button id="fAb">Marked only</button></div><p style="margin:8px 0 0;font-size:12px;color:var(--mu)">Tap once = Absent &middot; twice = Half leave &middot; three times = clear &middot; amber L = approved leave (locked)</p><div class="dlrow"><input id="pdt" type="date" aria-label="Date for the image"><button class="btn" id="dl">Download PNG</button></div></div>
  <div id="list"></div></div>
</div>
<div class="bar" id="bar" hidden><div class="in"><div class="cnt"><span id="n">0</span><small id="of"></small></div>
 <button class="btn" id="sub">Submit absentees</button></div></div>
<div id="toast"></div>
<script>
const $=i=>document.getElementById(i);let S=[],A=new Set(),Lv=new Set(),H=new Set(),NC='',LK=false,only=false,dirty=false,lastDate="",CFG=null;
try{CFG=JSON.parse(localStorage.getItem("gct_cr")||"null")}catch(e){}
const saveCfg=()=>{try{CFG?localStorage.setItem("gct_cr",JSON.stringify(CFG)):localStorage.removeItem("gct_cr")}catch(e){}};
async function api(fn,args){let res;
 try{res=await fetch(CFG.u,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({fn:fn,args:args}),redirect:"follow"})}
 catch(e){throw new Error("No connection. Check your internet and try again.")}
 let j;try{j=await res.json()}catch(e){throw new Error("Server error. Ask your teacher to check the app link.")}
 if(!j.ok)throw new Error(j.error);return j.data}
const call=(fn,...a)=>api(fn,a);
const t=new Date(),today=new Date(t-t.getTimezoneOffset()*6e4).toISOString().slice(0,10);$("dt").value=today;
function toast(m){const e=$("toast");e.textContent=m;e.style.display="block";clearTimeout(e._t);e._t=setTimeout(()=>e.style.display="none",2600)}
function sec(t,lv){const d=document.createElement("div");d.className="sec"+(lv?" lv":"");d.textContent=t;return d}
function row(s){const lv=Lv.has(s.roll),b=document.createElement("button"),a=A.has(s.roll),h=H.has(s.roll);b.className="row"+(a?" ab":h?" hf":lv?" lv":"");
 b.innerHTML='<span class="no"></span><span><span class="nm"></span><small></small></span><span class="mk">A</span>';
 b.querySelector(".no").textContent=s.roll.split("-").pop();b.querySelector(".nm").textContent=s.name;b.querySelector("small").textContent=s.roll;
 b.querySelector(".mk").textContent=lv?"L":h?"H":"A";if(h)b.querySelector("small").textContent=s.roll+" · Half leave";
 if(lv){b.querySelector("small").textContent=s.roll+" · On leave";b.onclick=()=>toast("Approved leave. This cannot be changed.")}
 else b.onclick=()=>{if(LK){if(a)return toast("Locked by your teacher. Only half leave can be changed.");if(h)H.delete(s.roll);else H.add(s.roll)}else if(a){A.delete(s.roll);H.add(s.roll)}else if(h){H.delete(s.roll)}else A.add(s.roll);dirty=true;$("state").textContent="Not submitted yet";count();draw()};
 return b}
function draw(){const q=$("q").value.trim().toLowerCase(),L=$("list");L.innerHTML="";
 if(NC){const p=document.createElement("div");p.className="panel";p.innerHTML="<h2></h2><p></p>";p.querySelector("h2").textContent=NC?"No class on this date":"This day is locked";p.querySelector("p").textContent=NC||"Your teacher has closed attendance for this date. Ask your teacher if something needs to change.";L.appendChild(p);count();return}
 if(LK){const bn=document.createElement("div");bn.className="panel";bn.style.cssText="margin:0 0 10px;padding:12px;background:#fdf3dc;border-color:#ecd49a";bn.textContent="This day is locked by your teacher. You can only add or remove half leaves.";L.appendChild(bn)}
 const base=S.filter(s=>(!only||A.has(s.roll)||H.has(s.roll))&&(!q||(s.name+" "+s.roll).toLowerCase().includes(q)));
 const ls=(only?[]:S.filter(s=>Lv.has(s.roll)&&(!q||(s.name+" "+s.roll).toLowerCase().includes(q)))),rest=base.filter(s=>!Lv.has(s.roll));
 if(ls.length){L.appendChild(sec("On approved leave ("+ls.length+")",1));ls.forEach(s=>L.appendChild(row(s)))}
 if(rest.length){if(ls.length)L.appendChild(sec("Class list"));rest.forEach(s=>L.appendChild(row(s)))}
 if(!L.children.length)L.innerHTML='<div class="panel">No students match.</div>';count()}
function count(){$("n").textContent=A.size;$("of").textContent="absent of "+S.length+(H.size?" · "+H.size+" half leave":"")}

function showSetup(msg){$("login").hidden=false;$("main").hidden=true;$("bar").hidden=true;$("rst").hidden=true;
 $("su").value=(CFG&&CFG.u)||$("su").value;$("sn").value=(CFG&&CFG.n)||$("sn").value;$("pin").value="";$("err").textContent=msg||"";$("cname").textContent="Class representative"}
function showMain(){$("login").hidden=true;$("main").hidden=false;$("rst").hidden=false;$("cname").textContent="Class representative · "+CFG.n}
async function loadDay(){$("state").textContent="Loading...";
 try{const r=await call("crLoad",CFG.pin,$("dt").value);lastDate=$("dt").value;dirty=false;
  S=r.students;A=new Set(r.absent);H=new Set(r.half||[]);Lv=new Set(r.leave||[]);NC=r.noclass||"";LK=!!r.locked;$("bar").hidden=!!NC;
  $("dlabel").textContent=new Date($("dt").value+"T12:00:00").toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});
  $("state").textContent=(A.size||H.size)?"Already submitted":"";draw()}
 catch(e){if(/wrong pin/i.test(e.message))showSetup("The class PIN has changed. Enter the new PIN.");else{$("state").textContent="";toast(e.message||"Could not load")}}}
$("go").onclick=async()=>{const u=$("su").value.trim(),pin=$("pin").value.trim(),n=$("sn").value.trim()||"Class";$("err").textContent="";
 if(!/^https:\/\/script\.google\.com\/\S+\/exec$/.test(u)){$("err").textContent="The web app link must start with https://script.google.com and end with /exec";return}
 if(!pin){$("err").textContent="Enter the class PIN";return}
 $("go").disabled=true;const prev=CFG;CFG={u:u,pin:pin,n:n};
 try{await call("crLoad",pin,today);saveCfg();showMain();await loadDay()}
 catch(e){CFG=prev;$("err").textContent=e.message||"Could not connect"}$("go").disabled=false};
$("dt").onchange=()=>{if(dirty&&!confirm("You have changes that are not submitted. Discard them?")){$("dt").value=lastDate;return}loadDay()};
$("rst").onclick=()=>{if(!confirm("Disconnect this phone from the class?"))return;CFG=null;saveCfg();showSetup("")};
$("q").oninput=draw;$("fAll").onclick=()=>{only=false;$("fAll").className="on";$("fAb").className="";draw()};
$("fAb").onclick=()=>{only=true;$("fAb").className="on";$("fAll").className="";draw()};
function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
function fit(x,t,max){if(x.measureText(t).width<=max)return t;while(t.length>1&&x.measureText(t+"…").width>max)t=t.slice(0,-1);return t+"…"}
const FF="Manrope,system-ui,-apple-system,Segoe UI,Roboto,sans-serif";
function renderPng(r,d,cname,logo){
 const nm={};r.students.forEach(s=>nm[s.roll]=s.name);
 const grp=l=>(l||[]).map(k=>({k:k,n:nm[k]||k})).sort((a,b)=>a.k.localeCompare(b.k,undefined,{numeric:true}));
 const ab=grp(r.absent),lv=grp(r.leave),hf=grp(r.half),total=r.students.length,present=Math.max(0,total-ab.length-lv.length-hf.length);
 const W=1080,P=56,IW=W-2*P,HH=290,GRN="#137333",RED="#b42318",AMB="#b7791f",BLU="#2563a8";
 const secs=[["Absent",ab,RED,"#fdecea","#f3c1bb"],["On leave",lv,AMB,"#fdf3dc","#ecd49a"],["Half leave",hf,BLU,"#e8f0fb","#bcd0ee"]].filter((s,i)=>i===0||s[1].length);
 const mc=document.createElement("canvas").getContext("2d");mc.font="700 24px "+FF;
 const CH=54,GX=12,GY=12;
 secs.forEach(s=>{let cx=0,cy=0;s.items=[];s[1].forEach(e=>{const t=fit(mc,e.n,520),w=12+38+12+mc.measureText(t).width+24;if(cx+w>IW){cx=0;cy+=CH+GY}s.items.push({e:e,t:t,x:cx,y:cy,w:w});cx+=w+GX});s.h=s[1].length?cy+CH:92});
 let H=HH+30+290+36;secs.forEach(s=>{H+=60+s.h+34});H+=70;
 const c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
 const shadow=on=>{x.shadowColor=on?"rgba(16,24,40,.12)":"transparent";x.shadowBlur=on?28:0;x.shadowOffsetY=on?10:0};
 // page background
 x.fillStyle="#edf3f0";x.fillRect(0,0,W,H);
 // header with gradient + pattern
 x.save();x.beginPath();x.rect(0,0,W,HH);x.clip();
 const g=x.createLinearGradient(0,0,W,HH);g.addColorStop(0,"#06382e");g.addColorStop(1,"#12805f");x.fillStyle=g;x.fillRect(0,0,W,HH);
 x.strokeStyle="rgba(255,255,255,.045)";x.lineWidth=2;for(let i=-HH;i<W;i+=26){x.beginPath();x.moveTo(i,HH);x.lineTo(i+HH,0);x.stroke()}
 x.fillStyle="rgba(255,255,255,.06)";x.beginPath();x.arc(W-40,20,230,0,7);x.fill();x.beginPath();x.arc(W-250,HH+30,150,0,7);x.fill();
 x.restore();
 // logo badge
 shadow(1);x.fillStyle="#fff";rr(x,P,60,128,128,28);x.fill();shadow(0);
 if(logo&&logo.naturalWidth){const k=Math.min(100/logo.naturalWidth,100/logo.naturalHeight),w=logo.naturalWidth*k,h=logo.naturalHeight*k;x.drawImage(logo,P+64-w/2,124-h/2,w,h)}
 // titles
 x.textBaseline="alphabetic";x.textAlign="left";
 const TX=P+156,TW=W-P-196-24-TX;
 x.fillStyle="#a8d8c8";x.font="700 19px "+FF;x.fillText(fit(x,"GOVERNMENT COLLEGE OF TECHNOLOGY, SARGODHA",TW),TX,94);
 x.fillStyle="#fff";x.font="800 54px "+FF;x.fillText("Attendance Record",TX,152);
 // class chip
 x.font="700 22px "+FF;const cn=fit(x,cname+"  ·  "+total+" students",TW-40),cw=x.measureText(cn).width+40;
 x.fillStyle="rgba(255,255,255,.16)";rr(x,TX,176,cw,42,21);x.fill();x.fillStyle="#fff";x.fillText(cn,TX+20,206);
 // date tile
 const dt=new Date(d+"T12:00:00"),TXL=W-P-196;
 shadow(1);x.fillStyle="#fff";rr(x,TXL,56,196,196,28);x.fill();shadow(0);
 x.save();rr(x,TXL,56,196,56,28);x.clip();x.fillStyle="#b42318";x.fillRect(TXL,56,196,56);x.restore();
 x.fillStyle="#b42318";x.fillRect(TXL,84,196,28);
 x.textAlign="center";x.fillStyle="#fff";x.font="800 24px "+FF;x.fillText(dt.toLocaleDateString("en-GB",{weekday:"long"}).toUpperCase().slice(0,9),TXL+98,95);
 x.fillStyle="#101828";x.font="800 84px "+FF;x.fillText(String(dt.getDate()).padStart(2,"0"),TXL+98,194);
 x.fillStyle="#667085";x.font="700 22px "+FF;x.fillText(dt.toLocaleDateString("en-GB",{month:"short",year:"numeric"}).toUpperCase(),TXL+98,232);
 // summary card
 const cy0=HH+30;shadow(1);x.fillStyle="#fff";rr(x,P,cy0,IW,290,30);x.fill();shadow(0);
 const parts=[[present,GRN],[hf.length,BLU],[lv.length,AMB],[ab.length,RED]],ccx=P+170,ccy=cy0+145,R0=112,RW=40;
 x.lineWidth=RW;x.lineCap="butt";x.strokeStyle="#e6ece9";x.beginPath();x.arc(ccx,ccy,R0,0,7);x.stroke();
 let a0=-Math.PI/2;const nz=parts.filter(p=>p[0]>0).length,gap=nz>1?0.05:0;
 if(total&&nz===1){const q=parts.filter(p=>p[0]>0)[0];x.strokeStyle=q[1];x.beginPath();x.arc(ccx,ccy,R0,0,7);x.stroke()}
 else if(total)parts.forEach(p=>{if(!p[0])return;const a1=a0+2*Math.PI*p[0]/total;x.strokeStyle=p[1];x.beginPath();x.arc(ccx,ccy,R0,a0+gap/2,a1-gap/2);x.stroke();a0=a1});
 const rate=total?Math.round(100*(total-ab.length)/total):0;
 x.fillStyle="#101828";x.font="800 52px "+FF;x.fillText(rate+"%",ccx,ccy+14);x.fillStyle="#667085";x.font="700 16px "+FF;x.fillText("ATTENDANCE",ccx,ccy+42);
 const leg=[["Present",present,GRN],["Absent",ab.length,RED],["On leave",lv.length,AMB],["Half leave",hf.length,BLU]];
 x.textAlign="left";
 leg.forEach((l,i)=>{const lx=P+340+(i%2)*300,ly=cy0+54+Math.floor(i/2)*112;
  x.fillStyle=l[2];x.beginPath();x.arc(lx+9,ly+22,9,0,7);x.fill();
  x.fillStyle="#101828";x.font="800 62px "+FF;x.fillText(String(l[1]),lx+32,ly+46);
  const nw=x.measureText(String(l[1])).width;
  if(total){x.fillStyle="#98a2b3";x.font="700 24px "+FF;x.fillText(Math.round(100*l[1]/total)+"%",lx+32+nw+14,ly+46)}
  x.fillStyle="#667085";x.font="700 20px "+FF;x.fillText(l[0].toUpperCase(),lx+32,ly+76)});
 // sections
 let y=cy0+290+36;
 secs.forEach((s,si)=>{const t=s[0],l=s[1],cl=s[2],bg=s[3],bd=s[4];
  x.fillStyle=cl;rr(x,P,y+6,12,34,6);x.fill();
  x.font="800 34px "+FF;x.fillStyle="#101828";x.fillText(t,P+30,y+36);const tw=x.measureText(t).width;
  x.fillStyle=bg;rr(x,P+30+tw+16,y+8,64,32,16);x.fill();x.fillStyle=cl;x.textAlign="center";x.font="800 22px "+FF;x.fillText(String(l.length),P+30+tw+16+32,y+31);x.textAlign="left";
  y+=60;
  if(!l.length){shadow(1);x.fillStyle="#fff";rr(x,P,y,IW,92,24);x.fill();shadow(0);
   x.fillStyle="#e3f4e8";x.beginPath();x.arc(P+56,y+46,28,0,7);x.fill();
   x.strokeStyle=GRN;x.lineWidth=6;x.lineCap="round";x.lineJoin="round";x.beginPath();x.moveTo(P+44,y+47);x.lineTo(P+53,y+57);x.lineTo(P+70,y+36);x.stroke();
   x.fillStyle="#101828";x.font="800 28px "+FF;x.fillText("No absentees",P+104,y+42);x.fillStyle="#667085";x.font="600 20px "+FF;x.fillText("Everyone on the register was accounted for.",P+104,y+70)}
  else s.items.forEach(it=>{const px=P+it.x,py=y+it.y;
   x.fillStyle=bg;rr(x,px,py,it.w,CH,CH/2);x.fill();x.strokeStyle=bd;x.lineWidth=2;rr(x,px+1,py+1,it.w-2,CH-2,CH/2);x.stroke();
   x.fillStyle=cl;x.beginPath();x.arc(px+10+19,py+CH/2,19,0,7);x.fill();
   x.fillStyle="#fff";x.font="800 17px "+FF;x.textAlign="center";x.fillText(it.e.k.split("-").pop(),px+29,py+CH/2+6);x.textAlign="left";
   x.fillStyle="#101828";x.font="700 24px "+FF;x.fillText(it.t,px+10+38+12,py+CH/2+8)});
  y+=s.h+34});
 // footer
 x.fillStyle="#d3ded9";x.fillRect(P,H-62,IW,2);
 x.fillStyle="#667085";x.font="600 19px "+FF;x.textAlign="left";
 x.fillText("Generated "+new Date().toLocaleString("en-GB",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}),P,H-26);
 x.textAlign="right";x.fillText("Government College of Technology, Sargodha",W-P,H-26);
 return c}
const CLASSNAME=()=>(CFG&&CFG.n)||"Class";
async function makePng(r,d){try{await document.fonts.load("800 30px Manrope");await document.fonts.load("700 24px Manrope");await document.fonts.load("600 20px Manrope")}catch(e){}
 const c=renderPng(r,d,CLASSNAME(),document.querySelector(".mono img"));
 await new Promise(ok=>c.toBlob(b=>{const url=URL.createObjectURL(b);
